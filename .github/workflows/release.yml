name: Release

# Push a tag like v1.0.0 to build, sign, notarize and publish Hive Desktop.
# The secrets it needs are listed in docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          case "$VERSION" in *-*) echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" ;; esac

      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"

      - name: Build and sign
        run: scripts/release/build.sh

      - name: Notarize the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/release/notarize.sh build/export/Hive.app

      - name: Package
        run: scripts/release/package.sh

      - name: Notarize the disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/release/notarize.sh "build/release/Hive-$VERSION.dmg"

      - name: Checksums and their signature
        env:
          RELEASE_SSH_KEY_CONTENT: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/release-key"
          printf '%s\n' "$RELEASE_SSH_KEY_CONTENT" > "$RUNNER_TEMP/release-key"
          RELEASE_SSH_KEY="$RUNNER_TEMP/release-key" scripts/release/checksums.sh build/release
          rm -f "$RUNNER_TEMP/release-key"
          test -f build/release/checksums.txt.sshsig

      - name: Homebrew cask
        run: scripts/release/cask.sh build/release > build/release/hive-desktop.rb

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" $PRERELEASE --generate-notes --title "Hive Desktop $VERSION" \
            build/release/Hive-"$VERSION".dmg \
            build/release/Hive-"$VERSION".zip \
            build/release/checksums.txt \
            build/release/checksums.txt.sshsig \
            build/release/hive-desktop.rb

      - name: Update the Homebrew tap
        if: env.PRERELEASE == '' && env.HAS_TAP_TOKEN == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY || 'admirable-oss/homebrew-tap' }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          cp build/release/hive-desktop.rb "$RUNNER_TEMP/tap/Casks/hive-desktop.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "hive-release"
          git config user.email "hive-release@users.noreply.github.com"
          git add Casks/hive-desktop.rb
          git commit -m "hive-desktop $VERSION"
          git push

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
